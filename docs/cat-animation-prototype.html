<!doctype html>
<html lang="zh-CN">
<head>

<title>似了喵？ · 猫猫动画</title>
<style>
/* 独立重绘原型：保留三态语义与暖色描边，仅展示角色。
   Design read: 角色动画画布 / redesign-preserve；差异 5、动效 6、密度 1、素材 8、品牌 7。
   8px 间距；奶油纸色、叶绿与暖灰；无阴影面板；原生 CSS 动画，无外部依赖。 */
:root{--paper:#faf6ed;--ink:#4a3b2c;--muted:#857969;--line:#e4ddcf;--ease:cubic-bezier(.77,0,.175,1)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 'PingFang SC','Microsoft YaHei',sans-serif;min-height:100svh;display:flex;align-items:center;justify-content:center}main{width:min(1120px,100%);padding:48px 32px}header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:48px}h1{font-size:19px;letter-spacing:.05em;margin:0;font-weight:650}header span{font-size:11px;letter-spacing:.16em;color:var(--muted)}.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}figure{margin:0;text-align:center;min-width:0}.stage{height:290px;display:grid;place-items:center}.cat{width:100%;max-width:300px;height:auto;overflow:visible}.ink{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.line{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.fur{fill:var(--fur)}.cream{fill:#fff5df}.pink{fill:#e8aaa0}.shadow{fill:#4a3b2c;opacity:.08;transform-origin:150px 237px}.online{--fur:#b5d786}.idle{--fur:#cfc7b8}.offline{--fur:#b9ad9c}figcaption{margin-top:24px}figcaption strong{font-size:17px;font-weight:600}figcaption p{font-size:12px;color:var(--muted);margin:6px 0 0}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 8px 3px 0;background:#7d9f51}.idle-dot{background:#b0a18a}.offline-dot{background:#9b9287}.controls{border-top:1px solid var(--line);margin:48px auto 0;padding-top:22px;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}button,select{font:inherit;font-size:12px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;min-height:36px;padding:6px 13px;cursor:pointer}button{min-width:82px}button:active{background:#eae2d3}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #7d9f51;outline-offset:4px}label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:10px}input{width:130px;accent-color:#7d9f51}.time{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);min-width:38px}.online .body{transform-origin:150px 232px;animation:breathe 4s var(--ease) infinite}.online .tail{transform-origin:195px 199px;animation:tail 3.2s var(--ease) infinite}.online .head{transform-origin:150px 164px;animation:look 8s var(--ease) infinite}.online .eyes{transform-origin:150px 122px;animation:blink 5.6s linear infinite}.online .ear-tip{transform-origin:101px 88px;animation:ear 8s var(--ease) infinite}.idle .sleeper{transform-origin:150px 228px;animation:sleep 4.8s var(--ease) infinite}.idle .tail-tip{transform-origin:206px 203px;animation:sleep-tail 9.6s var(--ease) infinite}.zzz{fill:var(--muted);font:bold 19px Georgia,serif;animation:dream 4.8s linear infinite}.zzz.second{animation-delay:-2.4s}.offline .spirit{animation:float 4.8s var(--ease) infinite}.offline .halo{transform-origin:150px 44px;animation:halo 4.8s var(--ease) infinite}.wing-left{transform-origin:112px 166px;animation:wing-left 2.4s var(--ease) infinite}.wing-right{transform-origin:188px 166px;animation:wing-right 2.4s var(--ease) infinite}.offline .shadow{animation:shadow 4.8s var(--ease) infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes tail{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(10deg)}}
@keyframes look{0%,35%,75%,100%{transform:rotate(0)}45%,62%{transform:rotate(-4deg)}}
@keyframes blink{0%,42%,46%,72%,76%,100%{transform:scaleY(1)}44%,74%{transform:scaleY(.08)}}
@keyframes ear{0%,63%,75%,100%{transform:rotate(0)}67%{transform:rotate(-9deg)}71%{transform:rotate(3deg)}}
@keyframes sleep{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,1.045)}}
@keyframes sleep-tail{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-7deg)}90%{transform:rotate(2deg)}}
@keyframes dream{0%{opacity:0;transform:translate(-3px,7px)}20%,65%{opacity:.75}100%{opacity:0;transform:translate(9px,-26px)}}
@keyframes float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-9px)}}
@keyframes halo{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes wing-left{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-13deg)}}
@keyframes wing-right{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(13deg)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.09}50%{transform:scaleX(.8);opacity:.05}}
@media(hover:hover) and (pointer:fine){button:hover,select:hover{background:#f0e9db}}
@media(max-width:680px){main{padding:28px 20px}header{margin-bottom:20px}.cats{grid-template-columns:1fr;gap:36px}.stage{height:230px}.cat{max-width:260px}figcaption{margin-top:4px}.controls{margin-top:32px;gap:12px}header span{font-size:9px}}
@media(prefers-reduced-motion:reduce){.cat *{animation:none!important}}
</style>

<footer class="controls" aria-label="动画播放控制">
<button id="play" type="button" aria-pressed="false">暂停动画</button>
<label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label>
<label>逐帧 <input id="seek" type="range" min="0" max="48" step="0.02" value="0" aria-label="动画时间（秒），拖动暂停"></label><output class="time" id="time">0.0 s</output>
</footer>
</main>
<script>
// 各部件独立运动；统一时间轴支持暂停、慢放和逐帧检查。
const play = document.getElementById('play');
const speed = document.getElementById('speed');
const seek = document.getElementById('seek');
const time = document.getElementById('time');
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
let paused = false;
const animations = () => document.getAnimations();
function setPaused(value) {
  paused = value;
  animations().forEach(animation => value ? animation.pause() : animation.play());
  play.textContent = value ? '播放动画' : '暂停动画';
  play.setAttribute('aria-pressed', String(value));
}
play.addEventListener('click', () => setPaused(!paused));
speed.addEventListener('change', () => animations().forEach(animation => animation.updatePlaybackRate(Number(speed.value))));
seek.addEventListener('input', () => {
  setPaused(true);
  animations().forEach(animation => { animation.currentTime = Number(seek.value) * 1000; });
  time.value = `${Number(seek.value).toFixed(1)} s`;
});
function syncPreference() {
  const reduce = motionPreference.matches;
  play.disabled = speed.disabled = seek.disabled = reduce;
  if (reduce) { play.textContent = '已减少动态'; time.value = '静态'; }
  else { setPaused(paused); animations().forEach(animation => animation.updatePlaybackRate(Number(speed.value))); }
}
motionPreference.addEventListener('change', syncPreference);
syncPreference();
// 低频更新控件，角色动画仍由浏览器 CSS 时间轴执行。
setInterval(() => {
  const first = animations()[0];
  if (!paused && first && !motionPreference.matches) {
    const seconds = Number(first.currentTime || 0) / 1000;
    seek.value = seconds % 48;
    time.value = `${(seconds % 48).toFixed(1)} s`;
  }
}, 100);
</script>
